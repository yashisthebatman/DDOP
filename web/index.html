<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Delivery Operations</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" charset="utf-8"></script>
</head>
<body>
    <div id="plotContainer"></div>
    <div id="notificationArea"></div>

    <div id="leftPanel" class="panel">
        <div class="header">
            <h1>Fleet & Mission Control</h1>
            <div id="simTime">Sim Time: 0.0s</div>
        </div>
        <div class="controls">
            <button id="toggleSimulationButton" class="run">▶ Run Sim</button>
            <!-- --- NEW: Batch Dispatch Button --- -->
            <button id="batchDispatchButton">Dispatch Batch</button>
            <button id="resetButton" class="danger">⚠️ Reset</button>
        </div>
        <div class="metrics">
            <div class="metric-item"><span class="label">Idle</span><span id="dronesIdle" class="value">0</span></div>
            <div class="metric-item"><span class="label">Active</span><span id="dronesActive" class="value">0</span></div>
            <div class="metric-item"><span class="label">Pending Orders</span><span id="ordersPending" class="value">0</span></div>
            <div class="metric-item"><span class="label">Completed Orders</span><span id="ordersCompleted" class="value">0</span></div>
        </div>

        <div class="content-section">
            <h2>Add New Order</h2>
            <form id="addOrderForm">
                <select id="hubSelect" name="hub_id" required title="Dispatch From Hub"></select>
                <select id="destinationSelect" name="dest_name" title="Delivery Destination"></select>
                <input type="number" name="payload_kg" value="1.0" min="0.1" max="5.0" step="0.1" required title="Payload (kg)">
                <label><input type="checkbox" name="high_priority"> High Priority</label>
                <button type="submit">Add Order</button>
            </form>
        </div>

        <div class="content-section drone-status-section">
            <h2>Drone Status</h2>
            <div class="table-container" id="droneStatusContainer">
                </div>
        </div>
    </div>

    <div id="rightPanel" class="panel">
        <div class="content-section">
            <h2>Pending Orders</h2>
            <div class="table-container">
                <table id="pendingOrdersTable">
                    <thead><tr><th>ID</th><th>Destination</th><th>Payload</th><th>Priority</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <!-- NEW: "In Process Orders" table added -->
        <div class="content-section">
            <h2>In Process Orders</h2>
            <div class="table-container">
                <table id="inProcessOrdersTable">
                    <thead><tr><th>Order ID</th><th>Drone</th><th>Destination</th><th>Status</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="content-section">
            <h2>Completed Missions</h2>
            <div class="table-container">
                <table id="completedMissionsTable">
                    <thead><tr><th>Drone</th><th>Stops</th><th>Outcome</th><th>Duration</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
        <div class="content-section log-section">
            <h2>Event Log</h2>
            <div id="logContainer">
                </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
